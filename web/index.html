<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Tailor your resume to a job description. Every rewrite comes from what is already on your resume." />
    <title>Tailor · Resume Studio</title>
    <script>
      // Apply the theme before the first paint (no flash of the wrong theme). "system" (the default) follows the
      // OS: dark only when it asks for dark. A saved "dark" from before the redesign (v1) counts as "system".
      try {
        var saved = JSON.parse(localStorage.getItem("tailor-settings") || "{}");
        var t = ((saved.state || {}).settings || {}).theme;
        if (["light", "dark", "system"].indexOf(t) < 0 || ((saved.version || 0) < 2 && t === "dark")) t = "system";
        if (t === "system") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
